agent:
  name: "Pod The Trader"
  model: "minimax-m2.7"
  max_iterations_per_turn: 10
  max_tokens: 2048

# Active LLM-proxy provider. Supported: "level5", "usepod". Override
# at startup with `--provider usepod`. Each provider has its own
# config section below (level5: / usepod:) carrying the deployment
# host and balance-threshold knobs.
provider: "level5"

level5:
  # Canonical Level5 domain. The API endpoint is derived as
  # `https://api.<base_domain>` and the dashboard as
  # `https://<base_domain>/dashboard/<api_token>`. Override with the
  # `--base-domain` CLI flag (e.g. `--base-domain usepod.ai`) when
  # pointing at an alternate deployment.
  base_domain: "level5.cloud"
  max_daily_spend_usdc: 10.0
  min_balance_threshold_usdc: 0.1

usepod:
  # UsePod is a Rust port of Level5 with a byte-identical API surface
  # (/v1/register, /proxy/{token}/v1/*, /proxy/{token}/balance) — only
  # the dashboard URL pattern and the absence of a credits ledger
  # differ. The bot can target this deployment by setting
  # `provider: "usepod"` above or passing `--provider usepod`.
  base_domain: "usepod.ai"
  min_balance_threshold_usdc: 0.1

trading:
  target_token_address: "EN2nnxrg8uUi6x2sJkzNPd2eT6rB9rdSoQNNaENA4RZA"
  max_position_size_usdc: 100.0
  # Per-slice notional cap as a fraction of total portfolio USD value
  # (SOL + USDC + target token). 0.15 means each slice is at most 15%
  # of the portfolio, so a $2,000 account caps individual slices at
  # $300. Replaces the previous hard-coded $150 ceiling: the cap now
  # grows with the account instead of pinning every account to the
  # same dollar number. The liquidity guard (`0.015 × liquidity_usd`)
  # still applies on top — the actual per-slice cap is the minimum.
  max_slice_pct_of_portfolio: 0.15
  max_slippage_bps: 50
  min_trade_size_usdc: 1.0
  max_daily_trades: 20
  cooldown_seconds: 300
  max_price_impact_pct: 1.5
  # Maximum allowable drift between the first successful swap's
  # output/input ratio in a cycle and any subsequent swap's quoted
  # ratio in the same direction. When the model fires multiple slices
  # inside one LLM turn, each market buy walks the AMM curve — the
  # per-swap slippage_bps gate doesn't see the cumulative drift. This
  # guard does: if a follow-up quote returns more than this percentage
  # less output per input than the first slice's actual fill, the swap
  # is rejected at the tool layer and the model is asked to HOLD.
  # 0.5% is roughly one slippage_bps gate's worth — generous enough to
  # absorb normal pool noise, tight enough to catch self-stacking.
  cycle_max_drift_pct: 0.5
  # Slice size used when Jupiter doesn't report liquidity_usd on the
  # latest price tick (Section D fallback in the agent system prompt).
  # Keep it conservative — this fires only when depth data is missing,
  # not when the token genuinely has thin liquidity.
  fallback_slice_usdc: 25.0

solana:
  # Primary RPC endpoint used for transactions and as the first read
  # attempt. Kept for backwards compatibility — `rpc_urls` below is the
  # authoritative list for reads.
  rpc_url: "https://api.mainnet-beta.solana.com"
  # Prioritized list of read endpoints. Portfolio reads walk this list
  # on every attempt so a rate-limited or unhealthy endpoint can be
  # skipped in favor of a working one. `rpc_url` is prepended
  # automatically if it's not already in the list.
  rpc_urls:
    - "https://solana-mainnet.gateway.tatum.io"
    - "https://api.mainnet.solana.com"
    - "https://solana-rpc.publicnode.com"
  ws_url: "wss://api.mainnet-beta.solana.com"

jupiter:
  quote_url: "https://api.jup.ag/swap/v1"
  price_url: "https://lite-api.jup.ag/price/v3"
  swap_url: "https://api.jup.ag/swap/v1"
  # Token search endpoint — returns price + liquidity + metadata for a
  # mint. Used by `_sample_prices` so each tick carries a real
  # liquidity_usd figure for Section D sizing.
  search_url: "https://lite-api.jup.ag/tokens/v2/search"

polling:
  funding_interval_seconds: 10
  funding_timeout_seconds: 3600
  balance_monitor_interval_seconds: 30
  # Minimum SOL the trading wallet must hold before the bot starts
  # trading. Needed to cover Jupiter swap gas — ~0.000005 SOL per tx
  # plus rent for any new associated token accounts.
  min_wallet_sol: 0.05

logging:
  level: "INFO"
  file: "pod_the_trader.log"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  max_bytes: 52428800
  backup_count: 5

storage:
  base_dir: "~/.pod_the_trader"
